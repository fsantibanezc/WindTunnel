[project]
name = "windtunnel2d"
version = "0.1.0"
description = "2D airfoil wind tunnel: Lattice Boltzmann solver (NumPy/CuPy) with WebGL visualization"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.0"]

[tool.uv]
package = false
